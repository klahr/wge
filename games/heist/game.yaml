id: heist
version: 1
title: The Mailroom Job
synopsis: >
  Ardent Freight's mail server has been quietly forwarding shipping manifests
  to somewhere it shouldn't. You have a mailroom account and a contact who
  will not answer questions directly.

base: wge/debian-13

hosts:
  # The machine's name. Its own motd calls it "mail relay 2", so anything else
  # would contradict the box on the first line a player reads.
  - id: relay2

packages:
  - postfix
  - sqlite3
  - vim-tiny
  - less
  - tcpdump

timeline:
  # No start date: the box's history is anchored to the build, so that its
  # fictional present and the real present are the same moment. That matters
  # because the box is alive -- cron fires, the backup agent writes its log --
  # and those entries carry the real clock. Against a fixed date in the past
  # they would all land months after the newest file on a carefully aged box.
  span: 120d

# Decoy accounts with their own mail, history and abandoned scripts. Four
# levels and exactly four home directories would hand over the shape of the
# game to anyone who runs ls /home.
noise_users: 7
