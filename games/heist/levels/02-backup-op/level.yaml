id: backup-op
user: bkup
name: Backup operator
role: backup
host: relay2
requires: [mailroom]

grants:
  # Two outbound edges: the on-call account, and half of what opens sysadmin.
  - kind: password
    to: ops-oncall
    placed_in: /var/backups/rota-notes.txt
  - kind: ssh-key
    to: sysadmin
    placed_in: /var/backups/nightly.tar.gz:home/dsundqvist/.ssh/id_ed25519

services:
  - name: backup-agent
    user: bkupd
    description: Ardent nightly backup agent
    exec: /usr/local/lib/backup-agent/agent
    port: 8377

cron:
  - schedule: "17 2 * * *"
    comment: stage last night's restore for review
    command: /usr/local/bin/stage-nightly
  - schedule: "40 6 * * *"
    comment: retention -- keeps failing, see ticket ARD-4471
    command: /usr/local/bin/prune-restores

narrative:
  correspondents:
    - address: r.vahl@ardent-freight.se
      name: Rikke Vahl
      stall_after: 1h
      replies:
        - "The backups are the point. They run nightly and nobody has read one in a year."
        - "A tarball of somebody's home directory will contain what a home directory contains."
        - "tar tzf the nightly tarball. Sundqvist's private key is in it."
